<nav class="bg-white shadow-md shadow-black/5 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex items-center justify-between h-16 lg:h-20">
      <a routerLink="/home" class="flex items-center gap-2">
        <img src="/assets/logo.jpeg" alt="Rudrakshama" class="h-9 lg:h-10 w-auto" />
        <span class="text-lg lg:text-xl font-bold text-brown-700 font-heading">Rudrakshama</span>
      </a>

      <ul class="hidden lg:flex items-center gap-1">
        @for (link of navLinks; track link.path) {
          <li>
            <a [routerLink]="link.path"
               routerLinkActive="text-saffron-500"
               [routerLinkActiveOptions]="{exact: true}"
               class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-brown-700 hover:bg-saffron-500/10 rounded-lg transition-all">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <div class="hidden lg:flex items-center gap-3">
        <a routerLink="/signup" class="px-5 py-2.5 bg-saffron-500 text-white text-sm font-semibold rounded-lg hover:bg-saffron-600 transition-all shadow-sm shadow-saffron-500/25">
          <i class="fa fa-shopping-cart mr-1" aria-hidden="true"></i> Shop Now
        </a>
      </div>

      <button (click)="mobileOpen = !mobileOpen" class="lg:hidden p-2 text-gray-700 hover:text-saffron-500" aria-label="Menu">
        @if (!mobileOpen) {
          <i class="fa fa-bars text-xl" aria-hidden="true"></i>
        } @else {
          <i class="fa fa-times text-xl" aria-hidden="true"></i>
        }
      </button>
    </div>
  </div>

  @if (mobileOpen) {
    <div class="lg:hidden border-t border-gray-100 bg-white">
      <div class="px-4 py-4 space-y-1">
        @for (link of navLinks; track link.path) {
          <a [routerLink]="link.path"
             (click)="mobileOpen = false"
             routerLinkActive="text-saffron-500 bg-saffron-500/5"
             class="block px-4 py-2.5 text-sm font-medium text-gray-700 hover:text-saffron-500 hover:bg-saffron-500/5 rounded-lg transition-colors">
            {{ link.label }}
          </a>
        }
        <hr class="my-3 border-gray-100">
        <a routerLink="/login" (click)="mobileOpen = false" class="block px-4 py-2.5 text-sm font-medium text-gray-700 hover:text-saffron-500 rounded-lg">Login</a>
        <a routerLink="/signup" (click)="mobileOpen = false" class="block px-4 py-2.5 text-sm font-semibold text-center bg-saffron-500 text-white rounded-lg">Register</a>
      </div>
    </div>
  }
</nav>
